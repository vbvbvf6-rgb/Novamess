name: Deploy to Pxxl

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Pxxl deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Pxxl deploy hook
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.PXXL_DEPLOY_HOOK_URL }}")
          echo "Pxxl response: $STATUS"
          if [[ "$STATUS" =~ ^2 ]]; then
            echo "✅ Deploy triggered successfully"
          else
            echo "❌ Deploy trigger failed with status $STATUS"
            exit 1
          fi
