# Pxxl deployment config — полный Docker-деплой (фронтенд + бэкенд вместе)
#
# Сайт и API раздаются с ОДНОГО домена Pxxl → работает без VPN в России.
# Root directory в Pxxl Dashboard ДОЛЖЕН быть "." (корень репо).
# VITE_API_URL НЕ нужен — фронтенд делает относительные запросы к /api/.
#
# https://pxxl.app/docs

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"

# Переменные окружения задавай в Pxxl Dashboard → Environment Variables:
#   DATABASE_URL            — строка подключения Supabase
#   JWT_SECRET              — 64 случайных символа
#   VAPID_PUBLIC_KEY        — публичный VAPID ключ
#   VAPID_PRIVATE_KEY       — приватный VAPID ключ
#   VAPID_EMAIL             — mailto:admin@nova.app
#   FIREBASE_SERVICE_ACCOUNT — JSON от Firebase Service Account (для FCM пушей)
